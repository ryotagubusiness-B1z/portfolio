<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1440" preserveAspectRatio="xMidYMid slice" role="img" aria-label="overhead view of a walnut desk with catalogue, mouse and plant">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a5230"/>
      <stop offset="0.5" stop-color="#5e3d22"/>
      <stop offset="1" stop-color="#3c2614"/>
    </linearGradient>
    <linearGradient id="winlight" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#f3e6c4" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#f3e6c4" stop-opacity="0"/>
    </linearGradient>
    <filter id="g4">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="bb"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="1200" height="1440" fill="url(#wood)"/>
  <!-- subtle wood grain lines -->
  <g stroke="#2c1c0e" stroke-width="2" opacity="0.25">
    <path d="M0 160 C 400 140 800 180 1200 150" fill="none"/>
    <path d="M0 520 C 400 500 800 540 1200 510" fill="none"/>
    <path d="M0 900 C 400 880 800 920 1200 890" fill="none"/>
    <path d="M0 1240 C 400 1220 800 1260 1200 1230" fill="none"/>
  </g>
  <rect width="1200" height="1440" fill="url(#winlight)"/>

  <!-- desk mat (top) -->
  <rect x="-40" y="-40" width="1280" height="430" fill="#23211e"/>
  <!-- keyboard hint -->
  <rect x="40" y="20" width="360" height="150" rx="8" fill="#1a1916"/>
  <!-- mouse -->
  <ellipse cx="320" cy="270" rx="64" ry="92" fill="#0e0d0c"/>

  <!-- catalogue -->
  <g transform="translate(560 760) rotate(-8)">
    <rect x="-20" y="-20" width="520" height="640" fill="#0a0a0a" opacity="0.4" filter="url(#bb)"/>
    <rect width="500" height="620" rx="6" fill="#141414"/>
    <rect x="0" y="0" width="500" height="360" rx="6" fill="#5b5f63"/>
    <rect x="30" y="40" width="240" height="70" fill="#ececec"/>
    <rect x="30" y="540" width="120" height="48" rx="6" fill="#1b62b3"/>
    <rect x="300" y="300" width="150" height="44" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- plant blur foreground (left) -->
  <g filter="url(#bb)" fill="#27381f" opacity="0.92">
    <path d="M-60 1440 C 60 1100 0 760 180 700 C 120 980 220 1200 160 1440 Z"/>
    <path d="M120 1440 C 80 1140 240 980 360 1040 C 240 1140 260 1320 300 1440 Z"/>
  </g>

  <rect width="1200" height="1440" filter="url(#g4)" opacity="0.4"/>
</svg>
