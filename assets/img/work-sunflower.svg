<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="sunflower beside a wall striped with venetian-blind light">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#9c9582"/>
      <stop offset="1" stop-color="#6f6753"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="1" gradientUnits="userSpaceOnUse"
      x2="1200" y2="1500">
      <stop offset="0" stop-color="#f4ecd6"/>
      <stop offset="1" stop-color="#cdbf9c"/>
    </linearGradient>
    <filter id="b2"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="grain2">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="1500"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="1500" fill="url(#wall)"/>
    <!-- diagonal blind light -->
    <g transform="rotate(-32 600 600)" opacity="0.85">
      <g fill="url(#stripe)">
        <rect x="-400" y="-120" width="2200" height="46"/>
        <rect x="-400" y="-12"  width="2200" height="46"/>
        <rect x="-400" y="96"   width="2200" height="46"/>
        <rect x="-400" y="204"  width="2200" height="46"/>
        <rect x="-400" y="312"  width="2200" height="46"/>
        <rect x="-400" y="420"  width="2200" height="46"/>
        <rect x="-400" y="528"  width="2200" height="46"/>
        <rect x="-400" y="636"  width="2200" height="46"/>
        <rect x="-400" y="744"  width="2200" height="46"/>
        <rect x="-400" y="852"  width="2200" height="46"/>
        <rect x="-400" y="960"  width="2200" height="46"/>
      </g>
    </g>
    <!-- box (lower left) -->
    <polygon points="-20,1080 360,990 360,1520 -20,1520" fill="#3a2c1d"/>
    <polygon points="-20,1080 360,990 360,1080 -20,1170" fill="#4d3a26"/>
    <!-- sunflower shadow on wall -->
    <g fill="#322a1c" opacity="0.5" filter="url(#b2)" transform="translate(520 760)">
      <circle r="78"/>
      <g>
        <rect x="-12" y="60" width="24" height="360"/>
      </g>
      <g stroke="#322a1c" stroke-width="0" >
        <path d="M0 -78 L20 -120 L40 -78Z" transform="rotate(0)"/>
      </g>
    </g>
    <!-- sunflower (real, in light) -->
    <g transform="translate(250 560)">
      <rect x="-9" y="40" width="18" height="640" fill="#5f6b39"/>
      <path d="M-9 300 q-120 -30 -150 60 q120 10 150 -30Z" fill="#5f6b39"/>
      <g fill="#c98b2a">
        <g id="petals">
          <ellipse cx="0" cy="-92" rx="26" ry="58"/>
        </g>
        <use href="#petals" transform="rotate(40)"/>
        <use href="#petals" transform="rotate(80)"/>
        <use href="#petals" transform="rotate(120)"/>
        <use href="#petals" transform="rotate(160)"/>
        <use href="#petals" transform="rotate(200)"/>
        <use href="#petals" transform="rotate(240)"/>
        <use href="#petals" transform="rotate(280)"/>
        <use href="#petals" transform="rotate(320)"/>
      </g>
      <circle r="58" fill="#e0a73c"/>
      <circle r="40" fill="#2a1d0c"/>
    </g>
    <rect width="1200" height="1500" filter="url(#grain2)" opacity="0.5"/>
  </g>
</svg>
