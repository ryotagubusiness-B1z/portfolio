<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="two stacked book spines in low amber light against darkness">
  <defs>
    <radialGradient id="dark" cx="0.5" cy="0.62" r="0.75">
      <stop offset="0" stop-color="#3a2c18"/>
      <stop offset="0.55" stop-color="#1a130a"/>
      <stop offset="1" stop-color="#0c0805"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#caa86a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#caa86a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#caa86a" stop-opacity="0"/>
    </linearGradient>
    <filter id="g3">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1500" height="1000" fill="url(#dark)"/>
  <!-- table light pool -->
  <ellipse cx="700" cy="800" rx="620" ry="150" fill="#b8975c" opacity="0.18"/>

  <!-- lower book -->
  <g transform="translate(360 560)">
    <rect width="800" height="120" rx="3" fill="#15110b"/>
    <rect width="800" height="120" rx="3" fill="url(#amber)"/>
    <rect x="40" y="40" width="36" height="40" fill="#d9cba6" opacity="0.8"/>
    <rect x="150" y="42" width="300" height="14" rx="3" fill="#e7dcbf" opacity="0.85"/>
    <rect x="150" y="66" width="200" height="12" rx="3" fill="#e7dcbf" opacity="0.7"/>
    <circle cx="740" cy="60" r="22" fill="none" stroke="#cdbf9c" stroke-width="3" opacity="0.7"/>
  </g>
  <!-- upper book -->
  <g transform="translate(330 432)">
    <rect width="760" height="116" rx="3" fill="#100c07"/>
    <rect width="760" height="116" rx="3" fill="url(#amber)" opacity="0.8"/>
    <rect x="40" y="38" width="34" height="40" fill="#d9cba6" opacity="0.75"/>
    <rect x="150" y="40" width="320" height="13" rx="3" fill="#e7dcbf" opacity="0.8"/>
    <rect x="150" y="64" width="180" height="11" rx="3" fill="#e7dcbf" opacity="0.6"/>
    <circle cx="700" cy="58" r="22" fill="none" stroke="#cdbf9c" stroke-width="3" opacity="0.6"/>
  </g>

  <rect width="1500" height="1000" filter="url(#g3)" opacity="0.45"/>
</svg>
