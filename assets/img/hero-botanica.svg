<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="botanical shadow on pale linen">
  <defs>
    <linearGradient id="linen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfc6b3"/>
      <stop offset="0.45" stop-color="#e7e0d0"/>
      <stop offset="1" stop-color="#b7ac95"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.62" cy="0.34" r="0.85">
      <stop offset="0" stop-color="#f1ead9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1d1810" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1600" height="2000" fill="url(#linen)"/>
  <rect width="1600" height="2000" fill="url(#pool)"/>

  <!-- botanical branch shadow -->
  <g fill="#15110a" opacity="0.62" filter="url(#soft)" transform="translate(150 760) rotate(-7)">
    <path d="M40 240 C 360 120 760 150 1240 60"/>
    <path d="M40 240 C 360 120 760 150 1240 60" stroke="#15110a" stroke-width="14" fill="none"/>
    <path d="M210 196 C 150 60 230 -10 320 30 C 300 150 270 200 210 196 Z"/>
    <path d="M430 168 C 380 30 470 -28 560 18 C 540 150 500 196 430 168 Z"/>
    <path d="M660 150 C 620 6 720 -44 808 8 C 792 140 740 188 660 150 Z"/>
    <path d="M900 118 C 880 -34 988 -70 1064 -8 C 1040 132 980 172 900 118 Z"/>
    <path d="M310 270 C 250 400 330 470 430 430 C 410 320 380 274 310 270 Z"/>
    <path d="M560 280 C 520 420 620 478 712 430 C 690 318 640 280 560 280 Z"/>
    <ellipse cx="1180" cy="70" rx="60" ry="92" transform="rotate(28 1180 70)"/>
  </g>

  <!-- hard window edge -->
  <polygon points="1600,0 1600,560 980,0" fill="#0f0b06" opacity="0.28"/>
  <rect width="1600" height="2000" filter="url(#grain)" opacity="0.5"/>
</svg>
