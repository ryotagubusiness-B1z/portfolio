<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Forgé">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#e8d49a"/>
      <stop offset="0.35" stop-color="#bd9a55"/>
      <stop offset="0.55" stop-color="#8c6d31"/>
      <stop offset="0.8" stop-color="#d8bf80"/>
      <stop offset="1"   stop-color="#a9883f"/>
    </linearGradient>
  </defs>
  <!-- ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#gold)" stroke-width="2.6"/>
  <circle cx="50" cy="50" r="41.5" fill="none" stroke="url(#gold)" stroke-width="1.1" opacity="0.7"/>
  <!-- monogram Fg -->
  <g fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-weight="700">
    <text x="29" y="63" font-size="42" text-anchor="middle">F</text>
    <text x="63" y="70" font-size="46" text-anchor="middle" font-style="italic">g</text>
  </g>
  <!-- diagonal slash -->
  <line x1="64" y1="22" x2="34" y2="80" stroke="url(#gold)" stroke-width="1.8" stroke-linecap="round"/>
</svg>
